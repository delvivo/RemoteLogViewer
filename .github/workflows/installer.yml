name: Installer Windows

# Parte dopo "Build e Release" (stesso tag v*) e aggiunge il setup.exe alla release già creata:
# evita che i due workflow creino la release in parallelo.
on:
  workflow_run:
    workflows: ["Build e Release"]
    types: [completed]

permissions:
  contents: write     # necessario per caricare il file sulla release

env:
  PROJECT_PATH: src/RemoteLogViewer/RemoteLogViewer.csproj
  TAG: ${{ github.event.workflow_run.head_branch }}   # per un push di tag è il nome del tag

jobs:
  installer:
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (eseguibile singolo, self-contained)
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Crea installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          & $iscc "/DAppVersion=$($env:TAG.TrimStart('v'))" installer\RemoteLogViewer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Carica installer sulla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.TAG }}" "dist/RemoteLogViewer-${{ env.TAG }}-setup.exe" --clobber --repo "${{ github.repository }}"
