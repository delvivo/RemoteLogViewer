name: Build e Release

on:
  push:
    tags:
      - 'v*'          # parte quando fai push di un tag tipo v1.0.0

permissions:
  contents: write     # necessario per creare la release

env:
  PROJECT_PATH: src/RemoteLogViewer/RemoteLogViewer.csproj   # <-- cambia con il percorso del tuo .csproj
  APP_NAME: RemoteLogViewer                          # <-- nome usato per lo zip

jobs:
  build:
    runs-on: windows-latest   # WPF/WinForms richiedono Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish (eseguibile singolo, self-contained)
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Crea zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "${{ env.APP_NAME }}-${{ github.ref_name }}-win-x64.zip"

      - name: Crea release su GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_NAME }}-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
